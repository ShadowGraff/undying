modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="Undying"
authors="${mod_authors}"
# NOTE: this mod is single-player only. It is inert on any multiplayer
# environment (LAN, remote server, dedicated server). See Environment.java.
description='''No-death protection: immortal mode, death lock, hidden slots, Void Sword.

SINGLE-PLAYER ONLY. All features are disabled in multiplayer.'''

[[mixins]]
config="undying.mixins.json"

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
